<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE WEB TOOLS — Cyberpunk Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#07090e',
                        cardbg: '#0f1422',
                        cardborder: '#1e293b',
                        accent: '#6366f1',
                        accenthover: '#4f46e5',
                        neoncyan: '#06b6d4',
                        neonpurple: '#a855f7'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Marked Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #07090e; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .glow-indigo { box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.4); }
        .glow-purple { box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.4); }
        .glow-cyan { box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.4); }
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .glass-panel {
            background: rgba(15, 20, 34, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white bg-grid-pattern">

    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col"></div>

    <!-- Global Toast Notification -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3"></div>

    <!-- Social Login Pajangan Dialog -->
    <div id="social-auth-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center hidden">
        <div class="glass-panel w-full max-w-md p-6 rounded-3xl shadow-2xl relative">
            <button onclick="closeSocialAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-2xl mx-auto flex items-center justify-center text-xl mb-3 border border-indigo-500/30"><i class="fa-solid fa-user-shield"></i></div>
                <h3 class="text-2xl font-bold text-white mb-1">Masuk Cepat</h3>
                <p class="text-xs text-gray-400">Pilih opsi autentikasi sosial media untuk melanjutkan.</p>
            </div>
            <div class="space-y-3">
                <button onclick="simulateSocialAuth('Google')" class="w-full flex items-center justify-center gap-3 bg-gray-900/80 hover:bg-gray-800 border border-gray-700 py-3 rounded-2xl font-medium text-sm transition text-white">
                    <i class="fa-brands fa-google text-red-400 text-base"></i> Lanjutkan dengan Google
                </button>
                <button onclick="simulateSocialAuth('Apple')" class="w-full flex items-center justify-center gap-3 bg-gray-900/80 hover:bg-gray-800 border border-gray-700 py-3 rounded-2xl font-medium text-sm transition text-white">
                    <i class="fa-brands fa-apple text-white text-base"></i> Lanjutkan dengan Apple
                </button>
                <button onclick="simulateSocialAuth('Telepon')" class="w-full flex items-center justify-center gap-3 bg-gray-900/80 hover:bg-gray-800 border border-gray-700 py-3 rounded-2xl font-medium text-sm transition text-white">
                    <i class="fa-solid fa-phone text-indigo-400 text-base"></i> Lanjutkan dengan telepon
                </button>
            </div>
            <div class="flex items-center my-5">
                <div class="flex-1 border-t border-gray-800"></div>
                <span class="px-3 text-[10px] text-gray-500 uppercase tracking-wider font-semibold">ATAU EMAIL</span>
                <div class="flex-1 border-t border-gray-800"></div>
            </div>
            <div class="space-y-3">
                <input type="email" id="social-email-input" placeholder="Alamat email Anda..." class="w-full bg-gray-950 border border-gray-700 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                <button onclick="simulateSocialEmail()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-90 text-white py-3 rounded-2xl font-semibold text-sm transition shadow-lg">Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Core -->
    <script>
        const DEFAULT_COVER = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop';

        const DEFAULT_USERS = [
            { id: 'usr_admin', username: 'Danzy', name: 'Danzy Admin', role: 'admin', tier: 'pro', points: 5000, streak: 7, lastLoginDate: new Date().toISOString().split('T')[0], streakClaimedToday: false, favorites: ['qr-generator', 'text-counter', 'json-formatter', 'gradient-generator'], theme: 'dark', bgCoverUrl: DEFAULT_COVER, avatarUrl: '' },
            { id: 'usr_operator', username: 'Operator1', name: 'Operator Support', role: 'operator', tier: 'premium', points: 1200, streak: 3, lastLoginDate: new Date().toISOString().split('T')[0], streakClaimedToday: false, favorites: ['text-counter'], theme: 'dark', bgCoverUrl: DEFAULT_COVER, avatarUrl: '' },
            { id: 'usr_demo', username: 'UserDemo', name: 'Pengguna Demo', role: 'user', tier: 'free', points: 250, streak: 1, lastLoginDate: '', streakClaimedToday: false, favorites: ['text-counter', 'calculator'], theme: 'dark', bgCoverUrl: DEFAULT_COVER, avatarUrl: '' }
        ];

        let state = {
            currentUser: null,
            users: JSON.parse(localStorage.getItem('uwt_users')) || DEFAULT_USERS,
            transactions: JSON.parse(localStorage.getItem('uwt_transactions')) || [
                { id: 'tx_1', userId: 'usr_demo', type: 'DAILY', amount: 10, balanceBefore: 240, balanceAfter: 250, desc: 'Daily Reward Hari 1', timestamp: new Date().toISOString() }
            ],
            inventory: JSON.parse(localStorage.getItem('uwt_inventory')) || [],
            redeemedCodes: JSON.parse(localStorage.getItem('uwt_redeemed')) || [],
            activeView: 'login',
            currentTool: null,
            redeemCodesConfig: [
                { code: 'WELCOME50', type: 'points', value: 50, active: true, maxUses: 1000, usedCount: 15 },
                { code: 'DAILY100', type: 'points', value: 100, active: true, maxUses: 500, usedCount: 42 },
                { code: 'PRO7DAYS', type: 'tier', tier: 'pro', durationDays: 7, active: true, maxUses: 200, usedCount: 8 },
                { code: 'PRO30DAYS', type: 'tier', tier: 'pro', durationDays: 30, active: true, maxUses: 100, usedCount: 3 },
                { code: 'TOOLUNLOCK', type: 'tool', toolId: 'advanced-regex', active: true, maxUses: 50, usedCount: 12 }
            ],
            pointShopItems: [
                { id: 'item_1', name: 'Premium Trial 1 Hari', price: 100, type: 'tier', tier: 'premium', desc: 'Akses penuh fitur Premium selama 24 jam.' },
                { id: 'item_2', name: 'Premium Trial 7 Hari', price: 500, type: 'tier', tier: 'premium', desc: 'Akses penuh fitur Premium selama 7 hari.' },
                { id: 'item_3', name: 'PRO Trial 1 Hari', price: 200, type: 'tier', tier: 'pro', desc: 'Akses penuh semua tools PRO selama 24 jam.' },
                { id: 'item_4', name: 'PRO Trial 7 Hari', price: 1000, type: 'tier', tier: 'pro', desc: 'Akses penuh semua tools PRO selama 7 hari.' },
                { id: 'item_5', name: 'Buka 1 Tool PRO 24 Jam', price: 150, type: 'tool_unlock', desc: 'Buka Tool Pro pilihan Anda selama 24 jam.' },
                { id: 'item_6', name: 'Tambah 1 Slot Favorit Permanen', price: 100, type: 'slot', value: 1, desc: 'Tambah batas slot tools favorit Anda.' },
                { id: 'item_7', name: 'Badge Profil Cyberpunk', price: 75, type: 'badge', desc: 'Tampilkan lencana eksklusif di profil.' }
            ]
        };

        const ALL_TOOLS = [
            // FREE TOOLS
            { id: 'qr-generator', name: 'QR Code Generator', desc: 'Buat Kode QR instan dari URL, teks, atau nomor telepon.', icon: 'fa-qrcode', tier: 'free', category: 'Dev & Utilities' },
            { id: 'text-counter', name: 'Text Counter & Stats', desc: 'Hitung kata, karakter, paragraf, & perkiraan waktu baca.', icon: 'fa-file-lines', tier: 'free', category: 'Text Tools' },
            { id: 'markdown-editor', name: 'Markdown Live Preview', desc: 'Tulis dan pratinjau format kode Markdown secara real-time.', icon: 'fa-brands fa-markdown', tier: 'free', category: 'Text Tools' },
            { id: 'case-converter', name: 'Text Case Converter', desc: 'Konversi teks ke UPPERCASE, lowercase, Title Case, CamelCase.', icon: 'fa-font', tier: 'free', category: 'Text Tools' },
            { id: 'uuid-generator', name: 'UUID/GUID v4 Generator', desc: 'Generate unique identifier v4 secara acak untuk database.', icon: 'fa-fingerprint', tier: 'free', category: 'Dev & Utilities' },
            { id: 'lorem-generator', name: 'Lorem Ipsum Generator', desc: 'Buat teks dummy paragraf atau kata untuk mockup visual.', icon: 'fa-paragraph', tier: 'free', category: 'Text Tools' },
            { id: 'unit-converter', name: 'Universal Unit Converter', desc: 'Konversi satuan Panjang, Berat, Suhu, dan Data Digital.', icon: 'fa-scale-unbalanced', tier: 'free', category: 'Calculators' },
            { id: 'gradient-generator', name: 'CSS Gradient Generator', desc: 'Desain kombinasi gradasi warna CSS linear & radial estetik.', icon: 'fa-palette', tier: 'free', category: 'Design Tools' },
            { id: 'password-generator', name: 'Password Generator', desc: 'Buat kata sandi acak dengan tingkat enkripsi tinggi.', icon: 'fa-key', tier: 'free', category: 'Security' },
            { id: 'calculator', name: 'Kalkulator Cepat', desc: 'Kalkulator perhitungan matematika standar dan ilmiah.', icon: 'fa-calculator', tier: 'free', category: 'Calculators' },
            { id: 'base64-tool', name: 'Base64 Encoder/Decoder', desc: 'Encode dan decode teks atau data ke format Base64.', icon: 'fa-code-compare', tier: 'free', category: 'Dev & Utilities' },
            
            // PREMIUM TOOLS
            { id: 'color-palette', name: 'Color Palette Generator', desc: 'Generate skema kombinasi 5 warna harmonis estetik.', icon: 'fa-eye-dropper', tier: 'premium', category: 'Design Tools' },
            { id: 'json-formatter', name: 'JSON Formatter & Beautifier', desc: 'Rapikan, validasi, dan beautify kode JSON berantakan.', icon: 'fa-code', tier: 'premium', category: 'Dev & Utilities' },
            { id: 'unix-converter', name: 'Unix Timestamp Converter', desc: 'Konversi Unix Epoch time ke format tanggal manusia.', icon: 'fa-clock', tier: 'premium', category: 'Dev & Utilities' },
            { id: 'minifier-tool', name: 'HTML / CSS Minifier', desc: 'Kompresi kode HTML/CSS untuk mempercepat muat situs.', icon: 'fa-compress', tier: 'premium', category: 'Dev & Utilities' },
            { id: 'image-compressor', name: 'Image Compressor', desc: 'Kompres ukuran file gambar PNG/JPG tanpa merusak kualitas.', icon: 'fa-image', tier: 'premium', category: 'Media Tools' },
            
            // PRO TOOLS
            { id: 'diff-checker', name: 'Text Diff Checker', desc: 'Bandingkan perbedaan baris antara dua berkas teks/kode.', icon: 'fa-code-compare', tier: 'pro', category: 'Dev & Utilities' },
            { id: 'sql-formatter', name: 'SQL Query Formatter', desc: 'Rapikan struktur sintaks query SQL yang panjang & rumit.', icon: 'fa-database', tier: 'pro', category: 'Dev & Utilities' },
            { id: 'advanced-regex', name: 'Advanced Regex Tester', desc: 'Uji ekspresi reguler (Regex) dengan highlight pencocokan.', icon: 'fa-magnifying-glass-chart', tier: 'pro', category: 'Dev & Utilities' }
        ];

        function saveDB() {
            localStorage.setItem('uwt_users', JSON.stringify(state.users));
            localStorage.setItem('uwt_transactions', JSON.stringify(state.transactions));
            localStorage.setItem('uwt_inventory', JSON.stringify(state.inventory));
            localStorage.setItem('uwt_redeemed', JSON.stringify(state.redeemedCodes));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgCol = type === 'success' ? 'bg-emerald-600 border border-emerald-400/30' : type === 'error' ? 'bg-rose-600 border border-rose-400/30' : 'bg-indigo-600 border border-indigo-400/30';
            toast.className = `${bgCol} text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 text-sm font-semibold transition transform duration-300 backdrop-blur-md`;
            toast.innerHTML = `<i class="fa-solid ${type==='success'?'fa-circle-check':type==='error'?'fa-circle-exclamation':'fa-circle-info'} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        function openSocialAuthModal() {
            document.getElementById('social-auth-modal').classList.remove('hidden');
        }
        function closeSocialAuthModal() {
            document.getElementById('social-auth-modal').classList.add('hidden');
        }
        function simulateSocialAuth(provider) {
            closeSocialAuthModal();
            showToast(`Berhasil masuk dengan ${provider} (Simulasi Pajangan)`, 'info');
            let demoUsr = state.users.find(u => u.username === 'UserDemo');
            if (demoUsr) {
                state.currentUser = demoUsr;
                checkDailyStreak(state.currentUser);
                navigate('dashboard');
            }
        }
        function simulateSocialEmail() {
            const email = document.getElementById('social-email-input').value;
            if (!email) {
                showToast('Masukkan email terlebih dahulu', 'error');
                return;
            }
            closeSocialAuthModal();
            showToast(`Autentikasi email ${email} berhasil (Simulasi Pajangan)`, 'success');
            let demoUsr = state.users.find(u => u.username === 'UserDemo');
            if (demoUsr) {
                state.currentUser = demoUsr;
                checkDailyStreak(state.currentUser);
                navigate('dashboard');
            }
        }

        function checkDailyStreak(user) {
            const today = new Date().toISOString().split('T')[0];
            if (user.lastLoginDate === today) return;

            if (!user.lastLoginDate) {
                user.streak = 1;
                user.streakClaimedToday = false;
            } else {
                const lastDate = new Date(user.lastLoginDate);
                const currDate = new Date(today);
                const diffTime = Math.abs(currDate - lastDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    user.streak = user.streak >= 7 ? 1 : user.streak + 1;
                    user.streakClaimedToday = false;
                } else if (diffDays > 1) {
                    user.streak = 1;
                    user.streakClaimedToday = false;
                }
            }
            user.lastLoginDate = today;
            saveDB();
        }

        function navigate(view, toolId = null) {
            state.activeView = view;
            if (toolId) state.currentTool = toolId;
            renderApp();
        }

        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (state.activeView === 'login') {
                app.innerHTML = renderLoginView();
            } else if (state.activeView === 'register') {
                app.innerHTML = renderRegisterView();
            } else {
                app.innerHTML = `
                    <div class="flex h-screen overflow-hidden">
                        <!-- Sidebar Desktop -->
                        <aside class="w-64 bg-cardbg border-r border-cardborder hidden md:flex flex-col justify-between z-30">
                            <div>
                                <div class="p-5 flex items-center gap-3 border-b border-cardborder">
                                    <div class="bg-gradient-to-tr from-indigo-600 to-purple-600 p-2.5 rounded-2xl text-white font-bold text-lg shadow-lg glow-indigo"><i class="fa-solid fa-toolbox"></i></div>
                                    <div>
                                        <h1 class="font-bold text-sm text-white tracking-wider">ULTIMATE TOOLS</h1>
                                        <p class="text-[10px] text-indigo-400 font-semibold uppercase tracking-wider">TIER: ${state.currentUser.tier.toUpperCase()}</p>
                                    </div>
                                </div>
                                <nav class="p-4 space-y-1 overflow-y-auto max-h-[calc(100vh-180px)]">
                                    <button onclick="navigate('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-semibold transition ${state.activeView==='dashboard'?'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30':'text-gray-400 hover:bg-gray-800/60 hover:text-white'}"><i class="fa-solid fa-chart-pie w-5 text-sm"></i> Dashboard</button>
                                    <button onclick="navigate('tools')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-semibold transition ${state.activeView==='tools'?'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30':'text-gray-400 hover:bg-gray-800/60 hover:text-white'}"><i class="fa-solid fa-screwdriver-wrench w-5 text-sm"></i> Utilitas Tools (${ALL_TOOLS.length})</button>
                                    <button onclick="navigate('daily')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-semibold transition ${state.activeView==='daily'?'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30':'text-gray-400 hover:bg-gray-800/60 hover:text-white'}"><i class="fa-solid fa-calendar-days w-5 text-sm"></i> Daily Rewards <span class="ml-auto bg-amber-500/20 text-amber-400 text-[10px] px-2 py-0.5 rounded-full font-bold">${state.currentUser.streak} Hari</span></button>
                                    <button onclick="navigate('pointshop')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-semibold transition ${state.activeView==='pointshop'?'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30':'text-gray-400 hover:bg-gray-800/60 hover:text-white'}"><i class="fa-solid fa-store w-5 text-sm"></i> Point Shop</button>
                                    <button onclick="navigate('redeem')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-semibold transition ${state.activeView==='redeem'?'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30':'text-gray-400 hover:bg-gray-800/60 hover:text-white'}"><i class="fa-solid fa-ticket w-5 text-sm"></i> Redeem Code</button>
                                    <button onclick="navigate('inventory')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-semibold transition ${state.activeView==='inventory'?'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30':'text-gray-400 hover:bg-gray-800/60 hover:text-white'}"><i class="fa-solid fa-box-archive w-5 text-sm"></i> Inventaris</button>
                                    <button onclick="navigate('upgrade')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-semibold transition ${state.activeView==='upgrade'?'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30':'text-gray-400 hover:bg-gray-800/60 hover:text-white'}"><i class="fa-solid fa-crown w-5 text-sm text-amber-400"></i> Upgrade Paket</button>
                                    <button onclick="navigate('profile')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-semibold transition ${state.activeView==='profile'?'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30':'text-gray-400 hover:bg-gray-800/60 hover:text-white'}"><i class="fa-solid fa-user-gear w-5 text-sm"></i> Edit Profil Foto</button>
                                    <button onclick="navigate('help')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-semibold transition ${state.activeView==='help'?'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30':'text-gray-400 hover:bg-gray-800/60 hover:text-white'}"><i class="fa-solid fa-circle-question w-5 text-sm"></i> Bantuan</button>
                                    ${state.currentUser.role === 'admin' ? `<button onclick="navigate('admin')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-semibold transition bg-purple-600/20 text-purple-300 hover:bg-purple-600 hover:text-white border border-purple-500/30"><i class="fa-solid fa-shield-halved w-5 text-sm"></i> Admin Panel</button>` : ''}
                                    ${state.currentUser.role === 'operator' ? `<button onclick="navigate('operator')" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-semibold transition bg-blue-600/20 text-blue-300 hover:bg-blue-600 hover:text-white border border-blue-500/30"><i class="fa-solid fa-headset w-5 text-sm"></i> Operator Panel</button>` : ''}
                                </nav>
                            </div>
                            <div class="p-4 border-t border-cardborder">
                                <div class="flex items-center justify-between mb-3 px-2">
                                    <div class="flex items-center gap-2.5">
                                        <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-sm"><i class="fa-solid fa-coins"></i></div>
                                        <div>
                                            <p class="text-[10px] text-gray-400">Saldo Poin</p>
                                            <p class="text-xs font-bold text-white">${state.currentUser.points} Poin</p>
                                        </div>
                                    </div>
                                </div>
                                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 bg-rose-600/10 hover:bg-rose-600 text-rose-400 hover:text-white py-2.5 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-right-from-bracket"></i> Keluar Sesi</button>
                            </div>
                        </aside>

                        <!-- Main Content Area -->
                        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
                            <!-- Top Header -->
                            <header class="bg-cardbg/80 backdrop-blur-md border-b border-cardborder h-16 flex items-center justify-between px-6 z-20">
                                <div class="flex items-center gap-4">
                                    <button onclick="showToast('Buka di layar desktop untuk pengalaman sidebar lengkap', 'info')" class="md:hidden text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-bars"></i></button>
                                    <h2 class="font-bold text-base text-white capitalize flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                        ${state.activeView.replace('-', ' ')}
                                    </h2>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="hidden sm:flex items-center gap-2 bg-gray-950 border border-gray-800 px-3 py-1.5 rounded-xl">
                                        <i class="fa-solid fa-coins text-amber-400 text-xs"></i>
                                        <span class="text-xs font-bold text-white">${state.currentUser.points} Poin</span>
                                    </div>
                                    <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('profile')">
                                        ${state.currentUser.avatarUrl ? 
                                            `<img src="${state.currentUser.avatarUrl}" class="w-9 h-9 rounded-full object-cover border border-indigo-500 shadow">` :
                                            `<div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white font-bold text-xs shadow">${state.currentUser.username[0].toUpperCase()}</div>`
                                        }
                                        <div class="hidden sm:block text-left">
                                            <p class="text-xs font-bold text-white leading-tight">${state.currentUser.name}</p>
                                            <p class="text-[10px] text-gray-400 uppercase font-medium">@${state.currentUser.username}</p>
                                        </div>
                                    </div>
                                </div>

        function filterToolsList() {
            const query = document.getElementById('tool-search').value.toLowerCase();
            const cards = document.querySelectorAll('.tool-card');
            cards.forEach(card => {
                const name = card.getAttribute('data-name');
                if (name.includes(query)) card.style.display = 'flex';
                else card.style.display = 'none';
            });
        }

        function checkToolAccess(toolTier) {
            const u = state.currentUser;
            if (u.role === 'admin') return true;
            if (toolTier === 'free') return true;
            if (toolTier === 'premium' && (u.tier === 'premium' || u.tier === 'pro')) return true;
            if (toolTier === 'pro' && u.tier === 'pro') return true;
            return false;
        }

        // TOOL EXECUTION LOGICS
        function generateQRCode() {
            const container = document.getElementById('qrcode-target');
            if (!container) return;
            container.innerHTML = '';
            const val = document.getElementById('qr-input').value || 'https://google.com';
            new QRCode(container, { text: val, width: 140, height: 140 });
        }

        function renderMarkdown() {
            const input = document.getElementById('md-input');
            const output = document.getElementById('md-output');
            if (input && output && window.marked) {
                output.innerHTML = marked.parse(input.value);
            }
        }

        function convertUnits(type) {
            const val = parseFloat(document.getElementById('unit-' + type).value) || 0;
            let m = 0;
            if (type === 'm') m = val;
            else if (type === 'km') m = val * 1000;
            else if (type === 'cm') m = val / 100;
            else if (type === 'ft') m = val * 0.3048;

            if (type !== 'm') document.getElementById('unit-m').value = (m).toFixed(2);
            if (type !== 'km') document.getElementById('unit-km').value = (m / 1000).toFixed(4);
            if (type !== 'cm') document.getElementById('unit-cm').value = (m * 100).toFixed(2);
            if (type !== 'ft') document.getElementById('unit-ft').value = (m / 0.3048).toFixed(2);
        }

        function updateGradient() {
            const c1 = document.getElementById('grad-c1').value;
            const c2 = document.getElementById('grad-c2').value;
            const css = `background: linear-gradient(135deg, ${c1}, ${c2});`;
            document.getElementById('gradient-preview').style = css;
            document.getElementById('grad-css').value = css;
        }

        function generatePalette() {
            const container = document.getElementById('palette-container');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const hex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                const box = document.createElement('div');
                box.className = 'flex items-end justify-center pb-2 font-mono text-[9px] font-bold text-white shadow cursor-pointer transition transform hover:scale-105';
                box.style.background = hex;
                box.innerText = hex;
                box.onclick = () => { navigator.clipboard.writeText(hex); showToast(`Warna ${hex} disalin!`, 'info'); };
                container.appendChild(box);
            }
        }

        function minifyCode() {
            const input = document.getElementById('minify-input').value;
            const minified = input.replace(/\s+/g, ' ').replace(/\/\*[\s\S]*?\*\//g, '').trim();
            document.getElementById('minify-output').value = minified;
            showToast('Kode berhasil dikompresi!', 'success');
        }

        function runTextCounter() {
            const text = document.getElementById('tool-text-input').value;
            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            const chars = text.length;
            const paras = text.trim() === '' ? 0 : text.split(/\n+/).filter(p => p.trim() !== '').length;
            const readTime = Math.ceil(words / 200 * 60);

            document.getElementById('tc-words').innerText = words;
            document.getElementById('tc-chars').innerText = chars;
            document.getElementById('tc-paras').innerText = paras;
            document.getElementById('tc-read').innerText = readTime + ' dtk';
        }

        function processRedeemCode() {
            const codeInput = document.getElementById('redeem-input').value.trim().toUpperCase();
            if (!codeInput) {
                showToast('Masukkan kode redeem terlebih dahulu', 'error');
                return;
            }

            const found = state.redeemCodesConfig.find(c => c.code === codeInput && c.active);
            if (!found) {
                showToast('Kode redeem tidak valid atau sudah tidak aktif!', 'error');
                return;
            }

            if (state.redeemedCodes.includes(codeInput + '_' + state.currentUser.id)) {
                showToast('Anda sudah pernah menggunakan kode ini sebelumnya!', 'error');
                return;
            }

            const u = state.currentUser;
            state.redeemedCodes.push(codeInput + '_' + u.id);
            found.usedCount++;

            if (found.type === 'points') {
                const balBefore = u.points;
                u.points += found.value;
                state.transactions.unshift({
                    id: 'tx_' + Date.now(), userId: u.id, type: 'REDEEM', amount: found.value,
                    balanceBefore: balBefore, balanceAfter: u.points, desc: `Redeem Kode: ${found.code}`, timestamp: new Date().toISOString()
                });
                showToast(`Berhasil! Mendapatkan +${found.value} Poin.`, 'success');
            } else if (found.type === 'tier') {
                u.tier = found.tier;
                showToast(`Berhasil! Paket ${found.tier.toUpperCase()} diaktifkan.`, 'success');
            }

            saveDB();
            renderApp();
        }

                            </div>
                            <div class="flex items-center gap-3">
                                <span class="bg-indigo-500/20 text-indigo-300 text-xs px-4 py-2 rounded-xl font-bold uppercase border border-indigo-500/30">Tier: ${u.tier}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Profile Image Upload Form Options -->
                    <div class="bg-cardbg border border-cardborder p-8 rounded-3xl shadow space-y-6">
                        <h3 class="font-bold text-white text-base flex items-center gap-2"><i class="fa-solid fa-image text-indigo-400"></i> Kustomisasi Foto Profil & Cover</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- Direct File Upload Avatar Card -->
                            <div class="bg-gray-950/80 border border-gray-800 p-5 rounded-2xl space-y-3">
                                <h4 class="font-bold text-xs text-white">Upload Foto Profil Avatar</h4>
                                <p class="text-[10px] text-gray-400">Unggah berkas foto diri (JPG, PNG, WebP) dari Galeri / Laptop.</p>
                                <label class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 cursor-pointer transition shadow">
                                    <i class="fa-solid fa-user-gear"></i> Upload Foto Profil (Avatar)
                                    <input type="file" accept="image/*" class="hidden" onchange="uploadAvatarPhoto(event)">
                                </label>
                            </div>

                            <!-- Direct File Upload Banner Card -->
                            <div class="bg-gray-950/80 border border-gray-800 p-5 rounded-2xl space-y-3">
                                <h4 class="font-bold text-xs text-white">Upload Banner Header Cover</h4>
                                <p class="text-[10px] text-gray-400">Unggah berkas foto latar belakang banner profil Anda.</p>
                                <label class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 cursor-pointer transition shadow">
                                    <i class="fa-solid fa-upload"></i> Upload Foto Cover (Banner)
                                    <input type="file" accept="image/*" class="hidden" onchange="uploadCoverPhoto(event)">
                                </label>
                            </div>
                        </div>

                        <!-- URL Input Option -->
                        <div class="bg-gray-950/80 border border-gray-800 p-5 rounded-2xl space-y-3">
                            <h4 class="font-bold text-xs text-white">Atau Gunakan Tautan / URL Gambar Online</h4>
                            <div class="flex gap-2">
                                <input type="url" id="avatar-url-input" placeholder="https://domain.com/foto-profil.jpg" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                                <button onclick="applyAvatarUrl()" class="bg-gray-800 hover:bg-gray-700 text-white text-xs px-4 py-2 rounded-xl font-semibold transition">Pasang Foto</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4 border-t border-cardborder">
                            <div class="bg-gray-950 p-4 rounded-2xl border border-gray-800">
                                <p class="text-[10px] text-gray-400">Total Saldo Poin</p>
                                <p class="text-base font-bold text-white">${u.points} Poin</p>
                            </div>
                            <div class="bg-gray-950 p-4 rounded-2xl border border-gray-800">
                                <p class="text-[10px] text-gray-400">Daily Login Streak</p>
                                <p class="text-base font-bold text-white">${u.streak} Hari Beruntun</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function uploadCoverPhoto(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                state.currentUser.bgCoverUrl = event.target.result;
                saveDB();
                showToast('Foto cover banner berhasil diperbarui!', 'success');
                renderApp();
            };
            reader.readAsDataURL(file);
        }

        function uploadAvatarPhoto(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                state.currentUser.avatarUrl = event.target.result;
                saveDB();
                showToast('Foto profil avatar berhasil diperbarui!', 'success');
                renderApp();
            };
            reader.readAsDataURL(file);
        }

        function applyAvatarUrl() {
            const url = document.getElementById('avatar-url-input').value.trim();
            if (!url) {
                showToast('Masukkan URL gambar terlebih dahulu!', 'error');
                return;
            }
            state.currentUser.avatarUrl = url;
            saveDB();
            showToast('Foto profil berhasil dipasang dari URL!', 'success');
            renderApp();
        }

        function resetCoverPhoto() {
            state.currentUser.bgCoverUrl = DEFAULT_COVER;
            saveDB();
            showToast('Foto cover dikembalikan ke gambar awal!', 'info');
            renderApp();
        }

        function renderAdminView() {
            if (state.currentUser.role !== 'admin') {
                return `<div class="p-8 text-center text-rose-500 font-bold text-lg">Akses Ditolak. Anda bukan Administrator!</div>`;
            }
            return `
                <div class="space-y-6 max-w-6xl mx-auto">
                    <div class="bg-purple-900/20 border border-purple-500/30 p-6 rounded-3xl">
                        <h2 class="text-xl font-bold text-white mb-1"><i class="fa-solid fa-shield-halved text-purple-400 mr-2"></i> Admin Panel (Danzy)</h2>
                        <p class="text-xs text-gray-300">Kelola pengguna, statistik website, redeem code, dan konfigurasi sistem.</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="bg-cardbg border border-cardborder p-5 rounded-2xl">
                            <p class="text-[10px] text-gray-400 uppercase font-semibold">Total Pengguna Terdaftar</p>
                            <h3 class="text-2xl font-bold text-white mt-1">${state.users.length} Akun</h3>
                        </div>
                        <div class="bg-cardbg border border-cardborder p-5 rounded-2xl">
                            <p class="text-[10px] text-gray-400 uppercase font-semibold">Total Transaksi Tercatat</p>
                            <h3 class="text-2xl font-bold text-white mt-1">${state.transactions.length} Transaksi</h3>
                        </div>
                        <div class="bg-cardbg border border-cardborder p-5 rounded-2xl">
                            <p class="text-[10px] text-gray-400 uppercase font-semibold">Redeem Codes Aktif</p>
                            <h3 class="text-2xl font-bold text-white mt-1">${state.redeemCodesConfig.length} Kode</h3>
                        </div>
                    </div>

                    <div class="bg-cardbg border border-cardborder p-6 rounded-3xl shadow">
                        <h3 class="font-bold text-white text-sm mb-4">Kelola Pengguna Sistem</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-gray-300">
                                <thead class="border-b border-cardborder text-gray-400 uppercase">
                                    <tr>
                                        <th class="py-3 px-4">Nama</th>
                                        <th class="py-3 px-4">Username</th>
                                        <th class="py-3 px-4">Role</th>
                                        <th class="py-3 px-4">Tier</th>
                                        <th class="py-3 px-4">Poin</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-cardborder">
                                    ${state.users.map(usr => `
                                        <tr>
                                            <td class="py-3 px-4 font-bold text-white">${usr.name}</td>
                                            <td class="py-3 px-4">@${usr.username}</td>
                                            <td class="py-3 px-4 uppercase"><span class="bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded">${usr.role}</span></td>
                                            <td class="py-3 px-4 uppercase"><span class="bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded">${usr.tier}</span></td>
                                            <td class="py-3 px-4 font-bold text-amber-400">${usr.points} Poin</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderOperatorView() {
            return `
                <div class="space-y-6 max-w-4xl mx-auto">
                    <div class="bg-blue-900/20 border border-blue-500/30 p-6 rounded-3xl">
                        <h2 class="text-xl font-bold text-white mb-1"><i class="fa-solid fa-headset text-blue-400 mr-2"></i> Operator Panel</h2>
                        <p class="text-xs text-gray-300">Panel operasional memantau aktivitas pengguna dan tiket bantuan.</p>
                    </div>
                    <div class="bg-cardbg border border-cardborder p-6 rounded-3xl shadow">
                        <h3 class="font-bold text-white text-sm mb-2">Tiket Bantuan Terbaru</h3>
                        <p class="text-xs text-gray-400">Sistem berjalan normal. Tidak ada tiket bantuan aktif saat ini.</p>
                    </div>
                </div>
            `;
        }

        function renderHelpView() {
            return `
                <div class="space-y-6 max-w-3xl mx-auto">
                    <div class="bg-cardbg border border-cardborder p-8 rounded-3xl shadow space-y-4">
                        <h2 class="text-xl font-bold text-white">Pusat Bantuan & Panduan</h2>
                        <p class="text-xs text-gray-400 leading-relaxed">Ultimate Web Tools adalah platform mandiri berbasis web yang menyediakan berbagai utilitas developer, pengolahan teks, dan gamifikasi poin harian. Jika Anda mengalami kendala, hubungi administrator atau operator sistem.</p>
                    </div>
                </div>
            `;
        }

        function renderCurrentViewContent() {
            switch(state.activeView) {
                case 'dashboard': return renderDashboardView();
                case 'tools': return renderToolsView();
                case 'daily': return renderDailyView();
                case 'pointshop': return renderPointShopView();
                case 'redeem': return renderRedeemView();
                case 'inventory': return renderInventoryView();
                case 'upgrade': return renderUpgradeView();
                case 'profile': return renderProfileView();
                case 'admin': return renderAdminView();
                case 'operator': return renderOperatorView();
                case 'help': return renderHelpView();
                default: return renderDashboardView();
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const u = state.users.find(usr => usr.username.toLowerCase() === usernameInput.toLowerCase());
            if (u) {
                state.currentUser = u;
                checkDailyStreak(u);
                showToast(`Selamat datang kembali, ${u.name}!`, 'success');
                navigate('dashboard');
            } else {
                showToast('Username tidak ditemukan! Silakan daftar atau gunakan akun Danzy.', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const username = document.getElementById('reg-username').value;
            if (state.users.some(usr => usr.username.toLowerCase() === username.toLowerCase())) {
                showToast('Username sudah digunakan! Pilih username lain.', 'error');
                return;
            }
            const newUser = {
                id: 'usr_' + Date.now(),
                username: username,
                name: name,
                role: 'user',
                tier: 'free',
                points: 100,
                streak: 1,
                lastLoginDate: new Date().toISOString().split('T')[0],
                streakClaimedToday: false,
                favorites: ['qr-generator', 'text-counter'],
                theme: 'dark',
                bgCoverUrl: DEFAULT_COVER,
                avatarUrl: ''
            };
            state.users.push(newUser);
            state.currentUser = newUser;
            saveDB();
            showToast('Registrasi berhasil! Bonus +100 poin diberikan.', 'success');
            navigate('dashboard');
        }

        function logout() {
            state.currentUser = null;
            navigate('login');
            showToast('Berhasil keluar sesi.', 'info');
        }

        function togglePasswordVisibility(id) {
            const el = document.getElementById(id);
            el.type = el.type === 'password' ? 'text' : 'password';
        }

        window.onload = function() {
            navigate('login');
        };
    </script>
</body>
</html>
